site_name: 部门知识库
docs_dir: wiki
site_description: 由 LLM Wiki Agent 自动维护的部门知识库

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search:
      lang: zh

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - attr_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SamurAIGPT/llm-wiki-agent
